<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="claude-sessions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#8A3A22"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" rx="24" ry="24" fill="#141414"/>

  <!-- Tile with totem on the left -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="136" height="136" rx="30" ry="30" fill="url(#bg)"/>
    <rect x="0" y="0" width="136" height="136" rx="30" ry="30"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Totem, scaled from 256→136 with padding. Coords proportional to the 256 source. -->
    <g transform="translate(0, 0) scale(0.531)">
      <rect x="70" y="188" width="116" height="28" rx="10" fill="#FFFFFF" opacity="0.55"/>
      <rect x="80" y="152" width="96"  height="28" rx="10" fill="#FFFFFF" opacity="0.75"/>
      <rect x="90" y="116" width="76"  height="28" rx="10" fill="#FFFFFF" opacity="0.9"/>
      <rect x="100" y="60" width="56"  height="48" rx="14" fill="#FFFFFF"/>
      <circle cx="128" cy="84" r="8" fill="#D97757"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(196, 76)" fill="#FFFFFF"
     font-family="ui-sans-serif, -apple-system, 'SF Pro Display', system-ui, Helvetica, Arial, sans-serif">
    <text x="0" y="32" font-size="44" font-weight="700" letter-spacing="-1">claude-sessions</text>
    <text x="2" y="72" font-size="20" fill="#D0D0D0" font-weight="400">Auto-resume Claude Code after a Mac restart</text>
  </g>
</svg>
