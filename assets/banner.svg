<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="claude-sessions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#A44A30"/>
    </linearGradient>
  </defs>

  <rect width="800" height="200" rx="24" ry="24" fill="#141414"/>

  <!-- Tile with escape glyph on the left -->
  <g transform="translate(32, 32)">
    <rect x="0" y="0" width="136" height="136" rx="30" ry="30" fill="url(#bg)"/>
    <rect x="0" y="0" width="136" height="136" rx="30" ry="30"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <g stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"
       transform="translate(0, 0)">
      <path d="M68 36 L68 90"/>
      <path d="M46 58 L68 36 L90 58"/>
      <path d="M40 108 L96 108"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(196, 76)" fill="#FFFFFF" font-family="ui-sans-serif, -apple-system, 'SF Pro Display', system-ui, Helvetica, Arial, sans-serif">
    <text x="0" y="32" font-size="44" font-weight="700" letter-spacing="-1">claude-sessions</text>
    <text x="2" y="72" font-size="20" fill="#D0D0D0" font-weight="400">Auto-resume Claude Code after a Mac restart</text>
  </g>
</svg>
